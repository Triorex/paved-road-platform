# Paved Road · release (reusable)
#
# Promotes ONE immutable, signed digest into an environment. Called once per environment by the
# app repo: dev, then staging, then (after staging-verify and QA sign-off) production.
# Rules this workflow enforces:
#
#   1. The digest must carry a keyless signature, SLSA provenance and an SBOM attestation from the
#      central secure-build workflow.
#   2. Dev accepts any branch (developer testing). Staging and production accept only a build of
#      refs/heads/main (checked on the provenance itself), so a branch build can never leave dev.
#   3. Each environment requires a signed promotion attestation from the one before it:
#      staging needs dev, production needs staging. No stage can be skipped.
#   4. Promotion is an exact copy: the environment tag must resolve to the signed digest itself.
#   5. Production also requires a passing, signed DAST attestation from staging-verify.yml and a
#      signed QA sign-off from qa-signoff.yml (which in turn enforces the API pentest gate when
#      security-policy.yml turns it on).
#   6. Staging and production never move backwards: the commit must equal or descend from the
#      commit deployed there. Roll back by rolling forward (revert on main). Dev may move anywhere.
#      One promotion per environment runs at a time.
#   6. Every promotion is recorded as a signed promotion attestation for that digest.
#   7. A GitHub Release is created only when production promotion succeeds (record-release.yml,
#      called by the production job only), so the releases list shows exactly what reached production.
#
# The environment's protection rules (required reviewers, main-only) live on the calling repo.
name: release

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      digest:
        type: string
        required: true
      environment:
        description: dev | staging | production
        type: string
        required: true

permissions: {}

env:
  COSIGN_VERSION: v2.6.4
  SIGNER_REGEX: ^https://github\.com/[Tt]riorex/paved-road-platform/\.github/workflows/secure-build\.yml@.+$
  BUILD_WORKFLOW: Triorex/paved-road-platform/.github/workflows/secure-build.yml
  RELEASE_WORKFLOW: Triorex/paved-road-platform/.github/workflows/release.yml
  VERIFY_WORKFLOW: Triorex/paved-road-platform/.github/workflows/staging-verify.yml
  QA_WORKFLOW: Triorex/paved-road-platform/.github/workflows/qa-signoff.yml
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  PROMOTION_TYPE: https://triorex.dev/attestations/promotion/v1
  DAST_TYPE: https://triorex.dev/attestations/dast/v1
  QA_TYPE: https://triorex.dev/attestations/qa-signoff/v1

jobs:
  promote:
    name: promote to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: promote-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read # find the commit currently deployed to the environment
      packages: write # move the environment tag
      id-token: write # sign the promotion attestation
      attestations: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      TARGET_ENV: ${{ inputs.environment }}
      REQUIRED_PRIOR: ${{ inputs.environment == 'production' && 'staging' || inputs.environment == 'staging' && 'dev' || '' }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify keyless signature (Sigstore)
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "$SIGNER_REGEX" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "signature verified: signed by the central secure-build workflow"
      - name: Only main-branch builds go beyond dev
        if: inputs.environment != 'dev'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::$TARGET_ENV accepts only builds of main; this run is on $REF (branch builds stop at dev)"
            exit 1
          fi
          echo "run is on main"
      - name: Verify SLSA provenance and SBOM attestations (GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_REF: ${{ inputs.environment != 'dev' && 'refs/heads/main' || '' }}
        run: |
          set -euo pipefail
          ref_flag=()
          [ -n "$SOURCE_REF" ] && ref_flag=(--source-ref "$SOURCE_REF")
          for type in https://slsa.dev/provenance/v1 https://cyclonedx.org/bom; do
            gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$OWNER" \
              --signer-workflow "$BUILD_WORKFLOW" --predicate-type "$type" "${ref_flag[@]}" > /dev/null
            echo "attestation verified: $type${SOURCE_REF:+ (built from $SOURCE_REF)}"
          done
      - name: Require evidence from the previous environment
        if: env.REQUIRED_PRIOR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$OWNER" \
                 --signer-workflow "$RELEASE_WORKFLOW" --predicate-type "$PROMOTION_TYPE" \
                 --format json > promotions.json 2> verify.err; then
            cat verify.err
            echo "::error::$DIGEST has no promotion attestation; it never passed $REQUIRED_PRIOR"
            exit 1
          fi
          envs=$(jq -r '[.[].verificationResult.statement.predicate.environment] | unique | join(",")' promotions.json)
          echo "promotion evidence for this digest: $envs"
          if ! jq -e --arg env "$REQUIRED_PRIOR" '[.[].verificationResult.statement.predicate.environment] | index($env)' promotions.json > /dev/null; then
            echo "::error::$DIGEST was never promoted to $REQUIRED_PRIOR; refusing to promote to $TARGET_ENV"
            exit 1
          fi
          echo "verified: digest passed $REQUIRED_PRIOR"
      - name: Require passing DAST evidence from staging
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$OWNER" \
                 --signer-workflow "$VERIFY_WORKFLOW" --predicate-type "$DAST_TYPE" \
                 --format json > dast.json 2> verify.err; then
            cat verify.err
            echo "::error::$DIGEST has no DAST attestation; staging-verify never passed for it"
            exit 1
          fi
          if ! jq -e '[.[].verificationResult.statement.predicate | select(.result == "pass" and .environment == "staging")] | length > 0' dast.json > /dev/null; then
            echo "::error::no passing staging DAST result for $DIGEST"
            exit 1
          fi
          echo "verified: DAST passed in staging; alerts $(jq -c '[.[].verificationResult.statement.predicate.alerts] | last' dast.json)"
      - name: Require QA sign-off from staging
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$OWNER" \
                 --signer-workflow "$QA_WORKFLOW" --predicate-type "$QA_TYPE" \
                 --format json > qa.json 2> verify.err; then
            cat verify.err
            echo "::error::$DIGEST has no QA sign-off; QA has not approved it in staging"
            exit 1
          fi
          if ! jq -e '[.[].verificationResult.statement.predicate | select(.result == "approved" and .environment == "staging")] | length > 0' qa.json > /dev/null; then
            echo "::error::no approved staging QA sign-off for $DIGEST"
            exit 1
          fi
          echo "verified: QA signed off in staging; $(jq -r '[.[].verificationResult.statement.predicate] | last | "approved by \(.approvers), API pentest \(.api_pentest)"' qa.json)"
      - name: Refuse to move the environment backwards
        if: inputs.environment != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=""
          while read -r id sha; do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then current="$sha"; break; fi
          done < <(gh api "repos/$REPO/deployments?environment=$TARGET_ENV&per_page=30" --jq '.[] | "\(.id) \(.sha)"')
          if [ -z "$current" ]; then echo "first deployment to $TARGET_ENV"; exit 0; fi
          status=$(gh api "repos/$REPO/compare/$current...$COMMIT" --jq .status)
          case "$status" in
            ahead|identical) echo "$TARGET_ENV is at ${current::7}; ${COMMIT::7} is $status (allowed)" ;;
            *) echo "::error::$TARGET_ENV runs ${current::7}; ${COMMIT::7} is $status of it. Refusing to roll $TARGET_ENV back; roll forward with a revert on main."
               exit 1 ;;
          esac
      - name: Promote by digest (exact copy, no rebuild, no re-wrap)
        id: promote
        run: |
          set -euo pipefail
          # --prefer-index=false: tag the signed manifest itself. The default wraps it in a new
          # image index with a new, unsigned digest (found in v1.0.2; see docs/adr/0003).
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TARGET_ENV" "$IMAGE@$DIGEST"
          resolved=$(docker buildx imagetools inspect "$IMAGE:$TARGET_ENV" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ "$resolved" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TARGET_ENV resolves to $resolved, not the signed digest $DIGEST"
            exit 1
          fi
          echo "tag $TARGET_ENV -> $resolved (matches the signed digest)"
          echo "promoted=true" >> "$GITHUB_OUTPUT"
      - name: Promotion record (predicate)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          jq -n --arg env "$TARGET_ENV" --arg repo "$REPO" --arg run "$RUN_ID" --arg attempt "$RUN_ATTEMPT" \
                --arg commit "$COMMIT" --arg actor "$ACTOR" --arg trig "$TRIGGERING_ACTOR" \
                --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{environment:$env, repository:$repo, commit:$commit, run_id:$run, run_attempt:$attempt,
              actor:$actor, triggering_actor:$trig, promoted_at:$at}' > promotion.json
          cat promotion.json
      - name: Signed promotion attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          predicate-type: ${{ env.PROMOTION_TYPE }}
          predicate-path: promotion.json
          push-to-registry: true
      - name: Summary
        run: |
          {
            echo "## Promoted to \`$TARGET_ENV\`"
            echo "- Digest: \`$DIGEST\` (tag \`$TARGET_ENV\` verified to resolve to it)"
            echo "- Verified: keyless signature, SLSA provenance, CycloneDX SBOM attestation"
            [ -n "$REQUIRED_PRIOR" ] && echo "- Required evidence: signed promotion to \`$REQUIRED_PRIOR\`"
            [ "$TARGET_ENV" = production ] && echo "- Required evidence: passing staging DAST and an approved QA sign-off"
            [ "$TARGET_ENV" != dev ] && echo "- Source: built from \`main\`; commit is not behind what \`$TARGET_ENV\` already runs"
            [ "$TARGET_ENV" = dev ] && echo "- Dev: any branch, may move backwards (developer testing; never promotable from a branch)"
            echo "- Recorded: signed promotion attestation (\`$PROMOTION_TYPE\`)"
          } >> "$GITHUB_STEP_SUMMARY"
