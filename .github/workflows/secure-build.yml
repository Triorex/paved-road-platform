# Paved Road · secure build (reusable)
#
#   test -> build & push by digest -> [image scan + Dockle] + [DAST] -> SBOM, sign, attest
#
# Signing is the LAST step and only runs when every earlier gate passed, so a valid signature
# means "this exact digest went through the paved road". The keyless signing identity is THIS
# workflow (job_workflow_ref), not the calling repo, which lets one Kyverno policy trust every
# repository in the fleet. Images that fail a gate stay unsigned, and unsigned is undeployable.
name: secure-build

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name under ghcr.io/<org>/ (usually the repo name)
        type: string
        required: true
      language:
        description: python | node
        type: string
        required: true
      language-version:
        description: Runtime version for tests; match the container's runtime (default python 3.15, node 22)
        type: string
        default: ""
      install-command:
        type: string
        required: true
      test-command:
        type: string
        required: true
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      container-port:
        type: number
        default: 8080
      health-path:
        type: string
        default: /healthz
      dast-mode:
        description: api (OpenAPI-driven ZAP scan) | baseline (passive spider)
        type: string
        default: baseline
      openapi-path:
        type: string
        default: /openapi.json
      platform-ref:
        type: string
        default: main
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      digest:
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  TRIVY_VERSION: v0.76.1
  COSIGN_VERSION: v2.6.4 # legacy signature format that Kyverno 1.19 verifies; see docs/adr/0002
  SIGNER_REGEX: ^https://github\.com/[Tt]riorex/paved-road-platform/\.github/workflows/secure-build\.yml@.+$
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  setup:
    name: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      platform-repo: ${{ steps.locate.outputs.repo }}
      platform-sha: ${{ steps.locate.outputs.sha }}
      policy: ${{ steps.policy.outputs.json }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Locate the platform commit this workflow runs from
        id: locate
        env:
          FALLBACK_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          repo="Triorex/paved-road-platform"; sha="$FALLBACK_REF"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=paved-road-platform" | jq -r .value)
            payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
            claims=$(printf '%s' "$payload" | base64 -d)
            sha=$(jq -r '.job_workflow_sha' <<<"$claims")
            repo=$(jq -r '.job_workflow_ref' <<<"$claims" | cut -d/ -f1-2)
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.locate.outputs.repo }}
          ref: ${{ steps.locate.outputs.sha }}
          path: .platform
          persist-credentials: false
      - id: policy
        run: echo "json=$(yq -o=json -I=0 .platform/security/security-policy.yml)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ unit tests
  test:
    name: unit tests
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.language-version || '3.15' }}
      - if: inputs.language == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.language-version || '22' }}
      - name: Install
        env:
          CMD: ${{ inputs.install-command }}
        run: bash -c "$CMD"
      - name: Test
        env:
          CMD: ${{ inputs.test-command }}
        run: bash -c "$CMD"

  # ------------------------------------------------------------------ build and push by digest
  build:
    name: build & push
    needs: [setup, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # JFrog OIDC when JFROG_ENABLED; no stored Artifactory tokens
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --- Enterprise front door (design; off unless the org variable JFROG_ENABLED is 'true') ---
      - name: JFrog CLI via OIDC
        if: vars.JFROG_ENABLED == 'true'
        uses: jfrog/setup-jfrog-cli@ae385c7164244e984cd20a58674e5b57f53596d7 # v5.3.4
        env:
          JF_URL: ${{ vars.JFROG_URL }}
        with:
          oidc-provider-name: github-oidc
      - name: Xray audit of resolved dependencies (policy paved-road-prod)
        if: vars.JFROG_ENABLED == 'true'
        run: jf audit --watches paved-road-prod
      - name: Hadolint (Dockerfile lint, gate on errors)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.context }}/${{ inputs.dockerfile }}
          failure-threshold: error
      - name: Image reference
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.image-name }}
        run: echo "image=ghcr.io/${OWNER,,}/${NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          provenance: false # our own SLSA provenance is attached after the gates pass
          sbom: false
          tags: ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Summary
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Built \`$IMAGE@$DIGEST\` (unsigned until every gate passes)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ image scan + CIS lint
  image-scan:
    name: image scan (trivy + dockle)
    needs: [setup, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - name: Approved CVE exceptions
        run: |
          pip install --disable-pip-version-check -q pyyaml==6.0.3
          python .platform/scripts/check_exceptions.py --file .security/exceptions.yaml --mode audit --emit-trivyignore .trivyignore.generated
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.REF }}
          severity: ${{ fromJSON(needs.setup.outputs.policy).gates.image_scan.severities }}
          ignore-unfixed: true
          trivyignores: .trivyignore.generated
          exit-code: ${{ fromJSON(needs.setup.outputs.policy).gates.image_scan.mode == 'enforce' && '1' || '0' }}
          format: table
      - name: Trivy image scan (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.REF }}
          trivyignores: .trivyignore.generated
          format: sarif
          output: trivy-image.sarif
      - name: Dockle (CIS Docker benchmark)
        env:
          LEVEL: ${{ fromJSON(needs.setup.outputs.policy).gates.image_lint.dockle_exit_level }}
          MODE: ${{ fromJSON(needs.setup.outputs.policy).gates.image_lint.mode }}
        run: |
          docker pull "$REF"
          docker save "$REF" -o image.tar
          code=1; [ "$MODE" = "enforce" ] || code=0
          docker run --rm -v "$PWD:/work" -w /work \
            goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 \
            --input image.tar --exit-code "$code" --exit-level "$LEVEL" \
            --format sarif --output dockle.sarif
      - if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - if: always() && hashFiles('dockle.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: dockle.sarif
          category: dockle

  # ------------------------------------------------------------------ DAST
  dast:
    name: dast (owasp zap)
    needs: [setup, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      PORT: ${{ inputs.container-port }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the exact image under test, hardened like production
        env:
          HEALTH: ${{ inputs.health-path }}
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p "8080:${PORT}" "$REF"
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:8080${HEALTH}" >/dev/null; then echo "app is up"; exit 0; fi
            sleep 2
          done
          docker logs app; echo "::error::app did not become healthy"; exit 1
      - name: Prepare ZAP workspace
        run: |
          cp .platform/security/zap-rules.tsv zap-rules.tsv
          chmod a+w "$GITHUB_WORKSPACE"
      - name: ZAP API scan (OpenAPI-driven)
        if: inputs.dast-mode == 'api'
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          target: http://localhost:8080${{ inputs.openapi-path }}
          format: openapi
          rules_file_name: zap-rules.tsv
          cmd_options: -I
          fail_action: ${{ fromJSON(needs.setup.outputs.policy).gates.dast.mode == 'enforce' }}
          allow_issue_writing: false
          artifact_name: zap-api-report
      - name: ZAP baseline scan
        if: inputs.dast-mode != 'api'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          target: http://localhost:8080
          rules_file_name: zap-rules.tsv
          cmd_options: -I
          fail_action: ${{ fromJSON(needs.setup.outputs.policy).gates.dast.mode == 'enforce' }}
          allow_issue_writing: false
          artifact_name: zap-baseline-report
      - if: failure()
        run: docker logs app

  # ------------------------------------------------------------------ SBOM, sign, attest
  sign:
    name: sbom, sign & attest
    needs: [build, image-scan, dast]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Fulcio) and GitHub attestations
      attestations: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact-retention: 7
      - name: Keyless signature + SBOM attestation (Sigstore)
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
      - name: SBOM attestation (GitHub artifact attestation, verified at release)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: SLSA build provenance (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Self-check the signature against the paved-road identity
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "$SIGNER_REGEX" --certificate-oidc-issuer "$OIDC_ISSUER" > verify.json
          {
            echo "## Signed and attested"
            echo "| | |"; echo "|---|---|"
            echo "| Image | \`$IMAGE@$DIGEST\` |"
            echo "| Signer | \`$(jq -r '.[0].optional.Subject' verify.json)\` |"
            echo "| SBOM | CycloneDX: cosign attestation (read by Kyverno) + GitHub attestation (read at release) |"
            echo "| Provenance | SLSA v1 via GitHub artifact attestations |"
          } >> "$GITHUB_STEP_SUMMARY"
