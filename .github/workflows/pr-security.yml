# Paved Road · PR security gates (reusable)
#
# Called by every repository in the fleet:
#   jobs:
#     pr-security:
#       uses: Triorex/paved-road-platform/.github/workflows/pr-security.yml@<commit-sha>
#
# All gates run in parallel. Thresholds and audit/enforce modes come from
# security/security-policy.yml at the SAME platform commit the caller pinned, so a platform
# release changes policy for the whole fleet with no app-repo change. The single `gate` job is
# the one required status check ("pr-security / gate") that org rulesets enforce.
name: pr-security

on:
  workflow_call:
    inputs:
      codeql-languages:
        description: 'JSON list of CodeQL languages, e.g. ["python","actions"]'
        type: string
        required: true
      k8s-manifests:
        description: Directory of Kubernetes manifests checked against the Kyverno policies
        type: string
        default: deploy/k8s
      exceptions-file:
        description: Repo-owned risk exceptions (changes routed to AppSec by CODEOWNERS)
        type: string
        default: .security/exceptions.yaml
      iac-skip-dirs:
        description: Comma-separated directories the IaC scan skips (deliberately insecure test fixtures)
        type: string
        default: ""
      platform-ref:
        description: Fallback platform ref when the OIDC token is unavailable (fork PRs)
        type: string
        default: main

permissions: {}

env:
  TRIVY_VERSION: v0.76.1
  KYVERNO_VERSION: v1.19.2
  PYYAML: pyyaml==6.0.3

jobs:
  # ------------------------------------------------------------------ setup
  setup:
    name: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # read job_workflow_sha from the OIDC token to find our own platform commit
    outputs:
      platform-repo: ${{ steps.locate.outputs.repo }}
      platform-sha: ${{ steps.locate.outputs.sha }}
      policy: ${{ steps.policy.outputs.json }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Locate the platform commit this workflow runs from
        id: locate
        env:
          FALLBACK_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          repo="Triorex/paved-road-platform"; sha="$FALLBACK_REF"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=paved-road-platform" | jq -r .value)
            payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
            claims=$(printf '%s' "$payload" | base64 -d)
            sha=$(jq -r '.job_workflow_sha' <<<"$claims")
            repo=$(jq -r '.job_workflow_ref' <<<"$claims" | cut -d/ -f1-2)
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Platform: $repo @ $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.locate.outputs.repo }}
          ref: ${{ steps.locate.outputs.sha }}
          path: .platform
          persist-credentials: false
      - name: Load security policy
        id: policy
        run: echo "json=$(yq -o=json -I=0 .platform/security/security-policy.yml)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ secrets
  secrets:
    name: secrets (gitleaks)
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - name: gitleaks (history scan)
        env:
          MODE: ${{ fromJSON(needs.setup.outputs.policy).gates.secrets.mode }}
        run: |
          code=1; [ "$MODE" = "enforce" ] || code=0
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.platform/security/gitleaks.toml --redact \
            --report-format sarif --report-path /repo/gitleaks.sarif --exit-code "$code"
      - if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ------------------------------------------------------------------ SAST: CodeQL
  codeql:
    name: sast (codeql ${{ matrix.language }})
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
    # CodeQL results gate merges through the org ruleset's code-scanning rule
    # (block on high-or-higher security alerts), so alerts block in one consistent place.

  # ------------------------------------------------------------------ SAST: Semgrep + Bandit
  sast-extra:
    name: sast (semgrep + bandit)
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install scanners (pinned)
        run: pip install --disable-pip-version-check semgrep==1.183.0 "bandit[sarif]==1.9.4" "$PYYAML"
      - name: Semgrep (registry rules + org custom rules)
        run: |
          semgrep scan --metrics=off --config p/default --config .platform/security/semgrep/ \
            --exclude .platform --sarif --output semgrep.sarif .
      - name: Bandit (Python only)
        run: |
          if find . -path ./.platform -prune -o -name '*.py' -print -quit | grep -q .; then
            bandit -r . -x ./.platform,./tests,./.venv -f sarif -o bandit.sarif || true
          fi
      - name: Gate on error-level findings
        env:
          MODE: ${{ fromJSON(needs.setup.outputs.policy).gates.sast.mode }}
        run: |
          files="semgrep.sarif"; [ -f bandit.sarif ] && files="$files bandit.sarif"
          # shellcheck disable=SC2086
          python .platform/scripts/sarif_gate.py $files --name "SAST (Semgrep + Bandit)" --mode "$MODE" --fail-levels error
      - if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ------------------------------------------------------------------ dependency review (diff)
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ fromJSON(needs.setup.outputs.policy).gates.dependency_review.fail_on_severity }}
          allow-licenses: ${{ join(fromJSON(needs.setup.outputs.policy).licenses.allow, ', ') }}
          warn-only: ${{ fromJSON(needs.setup.outputs.policy).gates.dependency_review.mode != 'enforce' }}
          comment-summary-in-pr: on-failure
          show-openssf-scorecard: true

  # ------------------------------------------------------------------ SCA (full tree)
  sca:
    name: sca (osv + trivy)
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner (report; Trivy below is the gate)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=sarif
            --output=osv.sarif
            --recursive
            ./
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - name: Apply approved CVE exceptions
        env:
          EXC_FILE: ${{ inputs.exceptions-file }}
        run: |
          pip install --disable-pip-version-check -q "$PYYAML"
          python .platform/scripts/check_exceptions.py --file "$EXC_FILE" --mode audit --emit-trivyignore .trivyignore.generated
      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .platform
          severity: ${{ fromJSON(needs.setup.outputs.policy).gates.sca.severities }}
          ignore-unfixed: true
          trivyignores: .trivyignore.generated
          exit-code: ${{ fromJSON(needs.setup.outputs.policy).gates.sca.mode == 'enforce' && '1' || '0' }}
          format: table
      - name: Trivy filesystem scan (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .platform
          trivyignores: .trivyignore.generated
          format: sarif
          output: trivy-fs.sarif
      - if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ------------------------------------------------------------------ package curation
  curation:
    name: package curation
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - name: Malicious, release-age and license checks
        env:
          EXC_FILE: ${{ inputs.exceptions-file }}
        run: |
          pip install --disable-pip-version-check -q "$PYYAML"
          python .platform/scripts/curation_check.py --root . --policy .platform/security/security-policy.yml --exceptions "$EXC_FILE"

  # ------------------------------------------------------------------ IaC
  iac:
    name: iac (trivy + checkov)
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy misconfiguration scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          skip-dirs: ${{ inputs.iac-skip-dirs }}
          severity: ${{ fromJSON(needs.setup.outputs.policy).gates.iac.severities }}
          exit-code: ${{ fromJSON(needs.setup.outputs.policy).gates.iac.mode == 'enforce' && '1' || '0' }}
          format: table
      - name: Trivy misconfiguration scan (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          skip-dirs: ${{ inputs.iac-skip-dirs }}
          format: sarif
          output: trivy-config.sarif
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: always()
        with:
          python-version: "3.13"
      - name: Checkov (report)
        if: always()
        env:
          SKIP: ${{ inputs.iac-skip-dirs }}
        run: |
          pip install --disable-pip-version-check -q checkov==3.4.3
          skip=(); IFS=',' read -ra dirs <<<"$SKIP"; for d in "${dirs[@]}"; do [ -n "$d" ] && skip+=(--skip-path "$d"); done
          checkov -d . --quiet --soft-fail --compact "${skip[@]}" \
            --framework terraform kubernetes dockerfile github_actions \
            -o sarif --output-file-path checkov-results
      - if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - if: always() && hashFiles('checkov-results/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

  # ------------------------------------------------------------------ the pipeline itself
  workflow-security:
    name: workflow security (zizmor + actionlint + pins)
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - name: zizmor (injection, excessive permissions, credential persistence)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false
          min-severity: ${{ fromJSON(needs.setup.outputs.policy).gates.workflow_security.min_severity }}
      - name: actionlint
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Every action pinned to a commit SHA
        if: always()
        env:
          MODE: ${{ fromJSON(needs.setup.outputs.policy).gates.workflow_security.mode }}
        run: python .platform/scripts/check_pinned_actions.py --root . --mode "$MODE"

  # ------------------------------------------------------------------ policy as code
  policy:
    name: policy (kyverno cli)
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - name: Install Kyverno CLI (checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$KYVERNO_VERSION" -R kyverno/kyverno \
            -p "kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" -p checksums.txt
          grep " kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" kyverno
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Apply workload policies to the manifests in this PR
        env:
          MANIFESTS: ${{ inputs.k8s-manifests }}
          MODE: ${{ fromJSON(needs.setup.outputs.policy).gates.policy.mode }}
        run: |
          if [ ! -d "$MANIFESTS" ]; then echo "No manifests at $MANIFESTS; nothing to check."; exit 0; fi
          if kyverno apply .platform/policies/kyverno/workload/ --resource "$MANIFESTS" | tee kyverno.txt; then
            echo "### Policy as code: all manifests pass" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### Policy as code: violations"; echo '```'; cat kyverno.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            [ "$MODE" = "enforce" ] && exit 1 || echo "::warning::policy violations (audit mode)"
          fi

  # ------------------------------------------------------------------ risk exceptions
  exceptions:
    name: risk exceptions
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.platform-repo }}
          ref: ${{ needs.setup.outputs.platform-sha }}
          path: .platform
          persist-credentials: false
      - name: Fail on expired or open-ended exceptions
        env:
          EXC_FILE: ${{ inputs.exceptions-file }}
          MODE: ${{ fromJSON(needs.setup.outputs.policy).gates.exceptions.mode }}
          MAX_DAYS: ${{ fromJSON(needs.setup.outputs.policy).gates.exceptions.max_days }}
        run: |
          pip install --disable-pip-version-check -q "$PYYAML"
          python .platform/scripts/check_exceptions.py --file "$EXC_FILE" --mode "$MODE" --max-days "$MAX_DAYS"

  # ------------------------------------------------------------------ single required check
  gate:
    name: gate
    if: always()
    needs: [setup, secrets, codeql, sast-extra, dependency-review, sca, curation, iac, workflow-security, policy, exceptions]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Evaluate gate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Paved Road PR gates"; echo
            echo "| Gate | Result |"; echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r '[to_entries[] | select(.value.result=="failure" or .value.result=="cancelled") | .key] | join(", ")' <<<"$RESULTS")
          if [ -n "$failed" ]; then echo "::error::Blocking gates failed: $failed"; exit 1; fi
          echo "All paved-road gates passed."
