# Paved Road · QA sign-off (reusable)
#
# The human gate between staging and production. The job runs in the `qa-signoff` environment,
# whose required reviewers are the `qa` team, so it starts only after QA has tested the release in
# staging and approved it. It then records a signed QA sign-off attestation for the digest;
# release.yml refuses production without one.
#
# Before signing off it checks that staging-verify passed for this exact digest, and applies the
# API pentest gate from security/security-policy.yml (gates.api_pentest.mode):
#   off     -> not required (recorded as "not required")
#   audit   -> a pentest result is looked for and recorded, but its absence doesn't block
#   enforce -> QA cannot sign off without a passing signed pentest attestation for the digest
name: qa-signoff

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      digest:
        type: string
        required: true
      platform-ref:
        description: Fallback platform ref when the OIDC token is unavailable (local runs)
        type: string
        default: main

permissions: {}

env:
  VERIFY_WORKFLOW: Triorex/paved-road-platform/.github/workflows/staging-verify.yml
  PENTEST_WORKFLOW: Triorex/paved-road-platform/.github/workflows/api-pentest.yml
  DAST_TYPE: https://triorex.dev/attestations/dast/v1
  PENTEST_TYPE: https://triorex.dev/attestations/api-pentest/v1
  QA_TYPE: https://triorex.dev/attestations/qa-signoff/v1

jobs:
  signoff:
    name: QA sign-off (staging)
    runs-on: ubuntu-24.04
    environment:
      name: qa-signoff
    permissions:
      contents: read
      packages: write # push the attestation next to the image
      id-token: write # sign the QA attestation
      attestations: write
      actions: read # read who approved the qa-signoff environment
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Require staging verification for this digest
        run: |
          set -euo pipefail
          if ! gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$OWNER" \
                 --signer-workflow "$VERIFY_WORKFLOW" --predicate-type "$DAST_TYPE" \
                 --format json > dast.json 2> verify.err; then
            cat verify.err
            echo "::error::$DIGEST has no staging verification; QA cannot sign off before admission and DAST pass"
            exit 1
          fi
          jq -e '[.[].verificationResult.statement.predicate | select(.result == "pass" and .environment == "staging")] | length > 0' dast.json > /dev/null
          echo "verified: staging admission and DAST passed for this digest"
      - name: API pentest gate from the security policy
        id: pentest
        env:
          FALLBACK_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          # Read the policy at the platform commit this workflow runs from (job_workflow_sha), via the API:
          # no checkout of another repo's code is needed for one YAML value.
          repo="Triorex/paved-road-platform"; sha="$FALLBACK_REF"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=paved-road-platform" | jq -r .value)
            payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
            claims=$(printf '%s' "$payload" | base64 -d)
            sha=$(jq -r '.job_workflow_sha' <<<"$claims")
            repo=$(jq -r '.job_workflow_ref' <<<"$claims" | cut -d/ -f1-2)
          fi
          gh api -H "Accept: application/vnd.github.raw" "repos/$repo/contents/security/security-policy.yml?ref=$sha" > policy.yml
          mode=$(yq '.gates.api_pentest.mode // "off"' policy.yml)
          result="not required"
          if [ "$mode" != off ]; then
            if gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$OWNER" \
                 --signer-workflow "$PENTEST_WORKFLOW" --predicate-type "$PENTEST_TYPE" \
                 --format json > pentest.json 2> /dev/null \
               && jq -e '[.[].verificationResult.statement.predicate | select(.result == "pass")] | length > 0' pentest.json > /dev/null; then
              result="pass"
            elif [ "$mode" = enforce ]; then
              echo "::error::API pentest is enforced (security-policy.yml) and $DIGEST has no passing pentest attestation"
              exit 1
            else
              result="missing (audit)"
              echo "::warning::API pentest in audit mode: no passing pentest attestation for $DIGEST"
            fi
          fi
          echo "API pentest gate: mode=$mode result=$result"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: QA sign-off record (predicate)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          PENTEST_MODE: ${{ steps.pentest.outputs.mode }}
          PENTEST_RESULT: ${{ steps.pentest.outputs.result }}
        run: |
          set -euo pipefail
          approvers=$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved") | select(any(.environments[]; .name == "qa-signoff")) | .user.login] | unique | join(", ")')
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" --arg run "$RUN_ID" \
                --arg approvers "${approvers:-n/a}" --arg pmode "$PENTEST_MODE" --arg presult "$PENTEST_RESULT" \
                --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{environment: "staging", stage: "qa-signoff", result: "approved", approvers: $approvers,
              api_pentest: $presult, api_pentest_mode: $pmode,
              repository: $repo, commit: $commit, run_id: $run, signed_off_at: $at}' > qa.json
          cat qa.json
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Signed QA sign-off attestation (required for production)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          predicate-type: ${{ env.QA_TYPE }}
          predicate-path: qa.json
          push-to-registry: true
      - name: Summary
        run: |
          {
            echo "## QA signed off in staging"
            echo "- Digest: \`$DIGEST\`"
            echo "- Approved by: $(jq -r .approvers qa.json)"
            echo "- Staging verification: admission and DAST passed for this digest"
            echo "- API pentest: $(jq -r '"\(.api_pentest) (mode \(.api_pentest_mode))"' qa.json)"
            echo "- Recorded: signed QA sign-off attestation (\`$QA_TYPE\`), required by production"
          } >> "$GITHUB_STEP_SUMMARY"
