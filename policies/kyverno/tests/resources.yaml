# Test fixtures for the workload baseline. One compliant Deployment and three that must be blocked.
apiVersion: apps/v1
kind: Deployment
metadata: { name: good-app, namespace: payments }
spec:
  selector: { matchLabels: { app: good-app } }
  template:
    metadata: { labels: { app: good-app } }
    spec:
      containers:
        - name: app
          image: ghcr.io/triorex/payments-api:sha-1a2b3c4
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: privileged-app, namespace: payments }
spec:
  selector: { matchLabels: { app: privileged-app } }
  template:
    metadata: { labels: { app: privileged-app } }
    spec:
      containers:
        - name: app
          image: ghcr.io/triorex/payments-api:sha-1a2b3c4
          securityContext:
            privileged: true
            runAsNonRoot: false
            allowPrivilegeEscalation: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dockerhub-app, namespace: payments }
spec:
  selector: { matchLabels: { app: dockerhub-app } }
  template:
    metadata: { labels: { app: dockerhub-app } }
    spec:
      containers:
        - name: app
          image: docker.io/library/nginx:1.27
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: latest-app, namespace: payments }
spec:
  selector: { matchLabels: { app: latest-app } }
  template:
    metadata: { labels: { app: latest-app } }
    spec:
      containers:
        - name: app
          image: ghcr.io/triorex/payments-api:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
